  <style>
    table, th, td {

    }
    /* Flex container for video and analysis column */
    .container {
        display: flex;
        align-items: flex-start;
    }
    
    /* Video on the left */
    #video {
        width: 70%;
        height: auto;
    }
    
    /* Analysis column on the right max-height: 100vh; /* For scrollable overflow if needed */*/
    #analysisColumn {
        width: 30%;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        /* overflow-y: auto; */
        
    }
     /* Style for each result wrapper */
     .result-wrapper {
        width: 60%;
        height: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #ccc;
        padding: 5px;
        border-radius: 5px;
        background-color: #f9f9f9;
    }

    /* Style for frame count label */
    .frame-label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 3px;
        color: #333;
    }
    /* Style for frame count label */
    .result-label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 3px;
        color: #f00909a7;
    }

    .imp-result-label {
        font-size: 14px;
        font-weight: bold;
        margin-bottom: 3px;
        color: #f00909a7;
    }
    
    /* Style for each analyzed image */
    .analysis-image {
        width: 60%;
        height: auto;
        border-radius: 3px;
        /* border: 1px solid #ccc;
        padding: 5px; */
    }
</style>
